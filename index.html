

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Impact, Arial, sans-serif;
}

#bienvenida {
    color: #ffffff;

    /* TAMAÑO DE LAS LETRAS */
    font-size: 90px;

    font-weight: bold;
    text-align: center;
    white-space: nowrap;

    /* EFECTO NEÓN AZUL */
    text-shadow:
        /* Borde/sombra oscura para mantener definición */
        3px 3px 0px #000000,

        /* Luz azul cercana */
        0 0 5px #00aaff,
        0 0 10px #00aaff,
        0 0 20px #008cff,

        /* Resplandor exterior */
        0 0 35px #0077ff,
        0 0 55px #0066ff,
        0 0 80px #0055ff;

    /* Animación suave del neón */
    animation: neonAzul 1.8s ease-in-out infinite alternate;
}

@keyframes neonAzul {
    from {
        text-shadow:
            3px 3px 0px #000000,
            0 0 5px #00aaff,
            0 0 10px #00aaff,
            0 0 20px #008cff,
            0 0 35px #0077ff,
            0 0 50px #0066ff;
    }

    to {
        text-shadow:
            3px 3px 0px #000000,
            0 0 8px #00ccff,
            0 0 15px #00aaff,
            0 0 30px #0099ff,
            0 0 50px #0077ff,
            0 0 75px #0055ff,
            0 0 100px #0044ff;
    }
}
</style>
</head>

<body>

<div id="bienvenida">BIENVENID@</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;
</script>

</body>
</html>
