

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, Helvetica, sans-serif;
}

/* MARCO DE NEÓN */
#marco-neon {
    display: inline-flex;
    justify-content: center;
    align-items: center;

    padding: 28px 55px;

    /* Marco redondeado como en la imagen */
    border: 4px solid #55aaff;
    border-radius: 60px;

    /* Fondo totalmente transparente */
    background: transparent;

    /* Brillo del marco */
    box-shadow:
        0 0 4px #ffffff,
        0 0 8px #55bbff,
        0 0 15px #008cff,
        0 0 30px #0066ff,
        0 0 50px rgba(0, 85, 255, 0.8),
        inset 0 0 8px #55bbff,
        inset 0 0 18px rgba(0, 119, 255, 0.8);

    animation: marcoNeon 2s ease-in-out infinite alternate;
}


/* TEXTO */
#bienvenida {
    color: #dff6ff;

    font-size: 90px;
    font-weight: normal;

    text-align: center;
    white-space: nowrap;

    /* NEÓN AZUL EN LAS LETRAS */
    text-shadow:
        0 0 2px #ffffff,
        0 0 5px #ffffff,
        0 0 8px #4dc3ff,
        0 0 15px #0099ff,
        0 0 25px #0077ff,
        0 0 40px #0055ff,
        0 0 65px #003cff;

    animation: textoNeon 1.8s ease-in-out infinite alternate;
}


/* PULSACIÓN DEL TEXTO */
@keyframes textoNeon {
    from {
        text-shadow:
            0 0 2px #ffffff,
            0 0 5px #ffffff,
            0 0 8px #4dc3ff,
            0 0 15px #0099ff,
            0 0 25px #0077ff,
            0 0 40px #0055ff;
    }

    to {
        text-shadow:
            0 0 3px #ffffff,
            0 0 7px #ffffff,
            0 0 12px #66ccff,
            0 0 22px #00aaff,
            0 0 35px #0088ff,
            0 0 55px #0066ff,
            0 0 80px #0044ff;
    }
}


/* PULSACIÓN DEL MARCO */
@keyframes marcoNeon {
    from {
        box-shadow:
            0 0 4px #ffffff,
            0 0 8px #55bbff,
            0 0 15px #008cff,
            0 0 30px #0066ff,
            0 0 45px rgba(0, 85, 255, 0.7),
            inset 0 0 8px #55bbff,
            inset 0 0 15px rgba(0, 119, 255, 0.7);
    }

    to {
        box-shadow:
            0 0 6px #ffffff,
            0 0 12px #66ccff,
            0 0 25px #0099ff,
            0 0 45px #0066ff,
            0 0 70px rgba(0, 68, 255, 0.9),
            inset 0 0 12px #66ccff,
            inset 0 0 25px rgba(0, 119, 255, 0.9);
    }
}

</style>
</head>

<body>

<div id="marco-neon">
    <div id="bienvenida">BIENVENID@</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;
</script>

</body>
</html>
