<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    position: relative;
    font-family: Impact, Arial, sans-serif;
}

#movimiento {
    position: absolute;
    top: 50%;

    display: flex;
    align-items: center;
    gap: 30px;

    white-space: nowrap;

    animation: mover 8s linear infinite;
}

/* FOTO CUADRADA 512x512 */
#foto {
    width: 512px;
    height: 512px;

    object-fit: cover;

    border: 4px solid white;

    box-shadow:
        0 0 15px white,
        4px 4px 10px black;
}

/* TEXTO */
#bienvenida {
    font-size: 100px;
    color: white;
    font-weight: bold;

    text-shadow:
        5px 5px 10px black,
        -3px -3px 6px black;
}

/* MOVIMIENTO IZQUIERDA → DERECHA */
@keyframes mover {

    0% {
        left: 0;
        transform: translate(-100%, -50%);
    }

    100% {
        left: 100%;
        transform: translate(0, -50%);
    }
}

</style>
</head>

<body>

<div id="movimiento">

    <img
        id="foto"
        src="https://www.pueblosecreto.com/net/usermedia/mediafile.ashx?iid=4687865&sz=512"
        alt="Foto">

    <div id="bienvenida">
        BIENVENIDO
    </div>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENIDO " + nombre;

</script>

</body>
</html>
