<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Impact, Arial, sans-serif;
}

#bienvenida {
    color: white;

    /* TAMAÑO DE LAS LETRAS */
    font-size: 90px;

    font-weight: bold;
    text-align: center;
    white-space: nowrap;

    /* EFECTO SOMBRA */
    text-shadow:
        3px 3px 0px #000,
        6px 6px 4px rgba(0, 0, 0, 0.9),
        10px 10px 12px rgba(0, 0, 0, 0.7);
}
</style>
</head>

<body>

<div id="bienvenida">BIENVENID@</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;
</script>

</body>
</html>
