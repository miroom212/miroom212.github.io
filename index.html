<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Impact, Arial, sans-serif;
}

#bienvenida {
    color: white;

    /* TAMAÑO DE LAS LETRAS */
    font-size: 90px;

    font-weight: bold;
    text-align: center;
    white-space: nowrap;

    /* EFECTO NEÓN AZUL */
    text-shadow:
        2px 2px 0px #000,
        0 0 5px #00aaff,
        0 0 10px #00aaff,
        0 0 20px #0088ff,
        0 0 35px #0066ff,
        0 0 50px #004cff;
}
</style>
</head>

<body>

<div id="bienvenida">BIENVENID@</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;
</script>

</body>
</html>
