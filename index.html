```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bienvenido</title>

    <style>

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .welcome {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .welcome-text {
            color: white;

            font-size: 40px;
            font-weight: bold;

            text-shadow:
                2px 2px 5px black,
                -2px -2px 5px black,
                2px -2px 5px black,
                -2px 2px 5px black;
        }

    </style>

</head>

<body>

<div class="welcome">

    <div id="welcomeText">
        Bienvenido
    </div>

</div>


<script>

    // Obtener los datos enviados por Utherverse

    const params =
        new URLSearchParams(window.location.search);


    // Member ID

    const memberId =
        params.get("uid") ||
        params.get("Memberid") ||
        "";


    // Nombre del miembro

    const memberName =
        params.get("name") ||
        params.get("membername") ||
        "Visitante";


    // Mostrar bienvenida

    document.getElementById("welcomeText").textContent =
        "Bienvenido " + memberName;


    // Mostrar información en la consola para comprobarlo

    console.log("Member ID:", memberId);
    console.log("Member Name:", memberName);

</script>

</body>

</html>
```
