<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    position: relative;
    font-family: Impact, Arial, sans-serif;
}

#bienvenida {
    position: absolute;

    /* Centrado vertical */
    top: 50%;
    transform: translateY(-50%);

    /* TAMAÑO */
    font-size: 100px;

    color: white;
    font-weight: bold;
    white-space: nowrap;

    text-shadow:
        5px 5px 10px black,
        -3px -3px 6px black;

    /* ANIMACIÓN */
    animation: mover 8s linear infinite;
}

/* MOVER DE IZQUIERDA A DERECHA */
@keyframes mover {

    0% {
        left: 0;
        transform: translate(-100%, -50%);
    }

    100% {
        left: 100%;
        transform: translate(0, -50%);
    }
}

</style>
</head>

<body>

<div id="bienvenida">BIENVENIDO</div>

<script>

const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENIDO " + nombre;

</script>

</body>
</html>
