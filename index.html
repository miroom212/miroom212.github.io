<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
}

body {
    position: relative;
    font-family: Impact, Arial, sans-serif;
}

#bienvenida {
    position: absolute;
    top: 50%;

    color: white;
    font-size: 90px;
    font-weight: bold;
    white-space: nowrap;

    /* SOMBRA DESENFOCADA */
    text-shadow:
        2px 2px 3px rgba(0, 0, 0, 1),
        5px 5px 8px rgba(0, 0, 0, 0.85),
        8px 8px 16px rgba(0, 0, 0, 0.55);

    /* MOVIMIENTO */
    animation: mover 8s linear infinite;
}

/* IZQUIERDA → DERECHA */
@keyframes mover {
    from {
        transform: translate(-100%, -50%);
        left: 0;
    }

    to {
        transform: translate(0, -50%);
        left: 100%;
    }
}
</style>
</head>

<body>

<div id="bienvenida">BIENVENID@</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;
</script>

</body>
</html>
