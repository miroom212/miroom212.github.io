```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    /* FONDO OSCURO */
    background: rgba(0, 0, 0, 0.85);
}

body {
    position: relative;
    font-family: Impact, Arial, sans-serif;
}

#bienvenida {
    position: absolute;
    top: 50%;

    /* TEXTO */
    color: #ffffff;
    font-size: 90px;
    font-weight: bold;
    white-space: nowrap;

    /* EFECTO NEÓN */
    text-shadow:
        0 0 5px #ffffff,
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 35px #00ffff,
        0 0 55px #00ffff,
        4px 4px 12px rgba(0, 0, 0, 0.9);

    /* MOVIMIENTO DE IZQUIERDA A DERECHA */
    animation:
        mover 12s linear infinite,
        neon 1.8s ease-in-out infinite alternate;
}


/* MOVIMIENTO IZQUIERDA → DERECHA */
@keyframes mover {
    from {
        left: 0;
        transform: translate(-100%, -50%);
    }

    to {
        left: 100%;
        transform: translate(0, -50%);
    }
}


/* PULSACIÓN SUAVE DEL NEÓN */
@keyframes neon {
    from {
        text-shadow:
            0 0 4px #ffffff,
            0 0 8px #00ffff,
            0 0 15px #00ffff,
            0 0 25px #00ffff,
            0 0 40px #00ffff,
            4px 4px 12px rgba(0, 0, 0, 0.9);
    }

    to {
        text-shadow:
            0 0 7px #ffffff,
            0 0 15px #00ffff,
            0 0 30px #00ffff,
            0 0 50px #00ffff,
            0 0 75px #00ffff,
            4px 4px 15px rgba(0, 0, 0, 0.9);
    }
}
</style>
</head>

<body>

<div id="bienvenida">BIENVENID@</div>

<script>
const params = new URLSearchParams(window.location.search);

const nombre =
    params.get("name") ||
    params.get("membername") ||
    "Visitante";

document.getElementById("bienvenida").textContent =
    "BIENVENID@ " + nombre;
</script>

</body>
</html>
```
